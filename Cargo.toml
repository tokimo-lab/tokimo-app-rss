[package]
name        = "tokimo-app-rss"
version     = "0.1.0"
edition     = "2024"
rust-version = "1.94.0"
license     = "MIT OR Apache-2.0"
description = "Resident RSS and Atom subscription app for Tokimo"
repository  = "https://github.com/tokimo-lab/tokimo-app-rss"

[workspace]
resolver = "2"

[lib]
name = "tokimo_app_rss"
path = "src/lib.rs"

[[bin]]
name = "tokimo-app-rss"
path = "src/main.rs"

[dependencies]
tokimo-bus-client   = { git = "https://github.com/tokimo-lab/tokimo-bus.git", rev = "11b3237bd09d6eeb95ae5f951e0660e0c23c87d1" }
tokimo-bus-protocol = { git = "https://github.com/tokimo-lab/tokimo-bus.git", rev = "11b3237bd09d6eeb95ae5f951e0660e0c23c87d1", features = ["axum"] }
tokimo-bus-auth     = { git = "https://github.com/tokimo-lab/tokimo-bus.git", rev = "11b3237bd09d6eeb95ae5f951e0660e0c23c87d1", features = ["axum", "cli-db"] }
tokimo-bus-cli      = { git = "https://github.com/tokimo-lab/tokimo-bus.git", rev = "11b3237bd09d6eeb95ae5f951e0660e0c23c87d1" }
tokimo-web-fetch    = { git = "https://github.com/tokimo-lab/tokimo-package-web-fetch", rev = "f9d14b78775c0b8d560520c42577e91139380a2e" }

clap              = { version = "4", features = ["derive", "env"] }
tokio              = { version = "1", features = ["full"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
uuid               = { version = "1", features = ["v4", "serde"] }
chrono             = { version = "0.4", features = ["serde"] }
sea-orm            = { version = "2.0.0-rc.38", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "with-uuid", "with-chrono", "with-json", "macros"] }
rust-embed         = { version = "8", features = ["debug-embed"] }
mime_guess         = "2"
anyhow             = "1"
axum = { version = "0.8", features = ["json"] }
ts-rs = { version = "12", features = ["serde-json-impl"] }
feed-rs = "2"
futures-util = "0.3"
httpdate = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
sha2 = "0.10"
unicode-normalization = "0.1"
url = "2"

[dev-dependencies]
http-body-util = "0.1"
tower = "0.5"
